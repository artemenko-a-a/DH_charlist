name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-validation:
    name: Fast validation (SwiftPM)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SwiftPM build
        run: swift build

      - name: SwiftPM tests
        run: swift test

  xcode-validation:
    name: Xcode host + coverage gate
    runs-on: macos-15
    needs: fast-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode host app build
        run: |
          set -eo pipefail
          xcodebuild \
            -project DHCharListHost/DHCharListHost.xcodeproj \
            -scheme DHCharListHost \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            build

      - name: Run coverage pipeline
        run: |
          ./scripts/run_xcode_coverage.sh

      - name: Enforce coverage policy gate
        run: |
          ./scripts/check_coverage_policy.sh

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: |
            DHCharListHost/artifacts/coverage/latest/TestResults.xcresult
            DHCharListHost/artifacts/coverage/latest/xcodebuild-test.log
            DHCharListHost/artifacts/coverage/latest/xccov-summary.txt
            DHCharListHost/artifacts/coverage/latest/xccov-report.json
            DHCharListHost/artifacts/coverage/latest/swiftpm-test.log
            DHCharListHost/artifacts/coverage/latest/swiftpm-codecov.json
            DHCharListHost/artifacts/coverage/latest/coverage-metrics.json
          if-no-files-found: warn

  web-validation:
    name: Web validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build
