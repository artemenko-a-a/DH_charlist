name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-package:
    name: SwiftPM build + test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  xcode-hostapp:
    name: Xcode build + analyze (DHCharListHost)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Xcode build
        run: |
          set -eo pipefail
          xcodebuild \
            -project DHCharListHost/DHCharListHost.xcodeproj \
            -scheme DHCharListHost \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            build
      - name: Xcode analyze
        run: |
          set -eo pipefail
          xcodebuild \
            -project DHCharListHost/DHCharListHost.xcodeproj \
            -scheme DHCharListHost \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            analyze
