name: UI Tests (manual)

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: "Which UI tests to run"
        required: false
        default: "smoke"
        type: choice
        options:
          - smoke
          - screenshots

permissions:
  contents: read

jobs:
  ui-tests:
    name: UI ${{ github.event.inputs.test_target }} tests (DHCharListHost)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Xcode environment
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Select simulator destination
        id: sim
        run: |
          DEST="$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime in sorted(data.get('devices', {}).keys(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for device in data['devices'][runtime]:
                  if device.get('isAvailable') and 'iPhone' in device.get('name', ''):
                      print('id=' + device['udid'])
                      sys.exit(0)
          print('platform=iOS Simulator,OS=latest')
          " 2>/dev/null || echo "platform=iOS Simulator,OS=latest")"
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          echo "Selected simulator destination: $DEST"

      - name: Boot simulator
        run: |
          DEST="${{ steps.sim.outputs.destination }}"
          if [[ "$DEST" == id=* ]]; then
            UDID="${DEST#id=}"
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b
          fi

      - name: Run UI smoke tests
        if: github.event.inputs.test_target == 'smoke'
        timeout-minutes: 12
        run: |
          UI_DESTINATION="${{ steps.sim.outputs.destination }}" ./scripts/run_ui_smoke.sh

      - name: Run UI screenshot tests
        if: github.event.inputs.test_target == 'screenshots'
        timeout-minutes: 15
        run: |
          UI_DESTINATION="${{ steps.sim.outputs.destination }}" ./scripts/run_ui_screenshots.sh

      - name: Upload UI smoke artifacts
        if: always() && github.event.inputs.test_target == 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-artifacts
          path: DHCharListHost/artifacts/ui-smoke/
          if-no-files-found: warn

      - name: Upload UI screenshot artifacts
        if: always() && github.event.inputs.test_target == 'screenshots'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-artifacts
          path: DHCharListHost/artifacts/ui-screenshots/
          if-no-files-found: warn
